name: Auto Task Workflow

on:
  workflow_dispatch:
 # schedule:
 #   - cron: '0 */12 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 强制 5 分钟超时，防止挂死浪费额度

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 自动缓存 pip 依赖，加速后续运行

      - name: 安装 Python 依赖项
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器及系统依赖
        run: |
          npx playwright install chromium --with-deps

      - name: 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 执行自动化脚本
        env:
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          PANEL_URL: ${{ secrets.PANEL_URL }}
          ACTION_API_URL: ${{ secrets.ACTION_API_URL }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_ORIGIN: ${{ secrets.TARGET_ORIGIN }}
          SITE_LABEL: ${{ secrets.SITE_LABEL }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          SERVERS_API_URL: ${{ secrets.SERVERS_API_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python main.py
